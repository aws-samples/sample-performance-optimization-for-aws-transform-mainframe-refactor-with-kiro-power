<div [ngStyle]="mapDivStyle()">
<div class='lgr_col empty'>
</div>
<div class='lgr_col'>
  <div class='lgr_11 col_01'><dynamic-field [id]='"labelAddAccount"' [size]=11 [line]=2 [column]=1 [(ngModel)]='labelAddAccount'></dynamic-field></div>
  <div class='lgr_14 col_01'><dynamic-field [id]='"labelUpdateAccount"' [size]=14 [line]=2 [column]=1 [(ngModel)]='labelUpdateAccount'></dynamic-field></div>
</div>
<div class='lgr_col empty'>
</div>
<div class='lgr_col'>
  <div class='lgr_13 col_01'><span class='default' id='text1'>Are you sure?</span>  </div>
</div>
<div class='lgr_col empty'>
</div>
<div class='lgr_col'>
  <div class='lgr_15 col_01'><span class='blue' id='text2'>Enter = Confirm</span>  </div>
</div>
<div class='lgr_col'>
  <div class='lgr_12 col_01'><span class='blue' id='text3'>F12 = Cancel</span>  </div>
</div>
<div class='lgr_col empty'>
</div>
<div class='lgr_col'>
  <div class='lgr_20 col_01'><dynamic-field [id]='"messageline"' [size]=20 [line]=9 [column]=1 [(ngModel)]='messageline'></dynamic-field></div>
</div>
</div>
