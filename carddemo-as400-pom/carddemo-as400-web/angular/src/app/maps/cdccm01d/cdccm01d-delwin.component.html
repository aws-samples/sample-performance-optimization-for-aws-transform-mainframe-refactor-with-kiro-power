<div [ngStyle]="mapDivStyle()">
<div class='lgr_col empty'>
</div>
<div class='lgr_col empty'>
</div>
<div class='lgr_col'>
  <div class='lgr_19 col_04'><span class='default' id='text1'>Credit Card Number:</span>  </div>
  <div class='lgr_19 col_24'><dynamic-field [id]='"cardnum"' [size]=19 [line]=3 [column]=24 [digitNb]='16' [decSize]='0' [edtwrd]='"    -    -    -    "' [(ngModel)]='cardnum'></dynamic-field></div>
  <div class='lgr_15 col_49'><span class='default' id='text2'>Current Status:</span>  </div>
  <div class='lgr_01 col_65'><dynamic-field [id]='"status"' [size]=1 [line]=3 [column]=65 [(ngModel)]='status'></dynamic-field></div>
</div>
<div class='lgr_col empty'>
</div>
<div class='lgr_col'>
  <div class='lgr_12 col_04'><span class='default' id='text3'>Customer ID:</span>  </div>
  <div class='lgr_09 col_17'><dynamic-field [id]='"custid"' [size]=9 [line]=5 [column]=17 [(ngModel)]='custid'></dynamic-field></div>
  <div class='lgr_15 col_34'><span class='default' id='text4'>Account Number:</span>  </div>
  <div class='lgr_12 col_50'><dynamic-field [id]='"acctnum"' [size]=12 [line]=5 [column]=50 [(ngModel)]='acctnum'></dynamic-field></div>
</div>
<div class='lgr_col empty'>
</div>
<div class='lgr_col'>
  <div class='lgr_21 col_04'><span class='red' id='text5'>Are you sure you want</span>  </div>
  <div class='lgr_18 col_26'><span class='red' id='text6'>to deactivate this</span>  </div>
  <div class='lgr_12 col_45'><span class='red' id='text7'>credit card?</span>  </div>
</div>
<div class='lgr_col empty'>
</div>
<div class='lgr_col'>
  <div class='lgr_09 col_04'><span class='blue' id='text8'>F1 = Help</span>  </div>
  <div class='lgr_19 col_18'><span class='blue' id='text9'>Enter = Confirm Yes</span>  </div>
  <div class='lgr_12 col_42'><span class='blue' id='text10'>F12 = Cancel</span>  </div>
</div>
<div class='lgr_col empty'>
</div>
<div class='lgr_col empty'>
</div>
<div class='lgr_col empty'>
</div>
<div class='lgr_col empty'>
</div>
<div class='lgr_col empty'>
</div>
<div class='lgr_col'>
  <div class='lgr_74 col_01'><dynamic-field [id]='"messageline"' [size]=74 [line]=15 [column]=1 [(ngModel)]='messageline'></dynamic-field></div>
</div>
</div>
