<div [ngStyle]="mapDivStyle()">
<div class='lgr_col'>

  <div class='lgr_08 col_71'><dynamic-field [id]='"date1"' [size]=8 [line]=1 [column]=71 [(ngModel)]='date1'></dynamic-field></div>
</div>
<div class='lgr_col'>
  <div class='lgr_10 col_01'><dynamic-field [id]='"pgmname"' [size]=10 [line]=2 [column]=1 [(ngModel)]='pgmname'></dynamic-field></div>
  <div class='lgr_23 col_29'><dynamic-field [id]='"labelTransactionMainScreen"' [size]=23 [line]=2 [column]=29 [(ngModel)]='labelTransactionMainScreen'></dynamic-field></div>
  <div class='lgr_08 col_71'><dynamic-field [id]='"time1"' [size]=8 [line]=2 [column]=71 [edtwrd]='"0  :  :  "' [(ngModel)]='time1'></dynamic-field></div>
</div>
<div class='lgr_col empty'>
</div>

</div>

</div>

  <div class='lgr_01 col_01'><dynamic-field [id]='"label"' [size]=1 [line]=7 [column]=1 [(ngModel)]='label'></dynamic-field></div>

  <div class='lgr_06 col_62'><dynamic-field [id]='"labelAmount"' [size]=6 [line]=7 [column]=62 [(ngModel)]='labelAmount'></dynamic-field></div>
  <div class='lgr_03 col_75'><dynamic-field [id]='"labelSts"' [size]=3 [line]=7 [column]=75 [(ngModel)]='labelSts'></dynamic-field></div>
</div>
</div>
