<div [ngStyle]="mapDivStyle()">
<div class='lgr_col'>
  <div class='lgr_10 col_01'><dynamic-field [id]='"pgmname"' [size]=10 [line]=1 [column]=1 [(ngModel)]='pgmname'></dynamic-field></div>
  <div class='lgr_12 col_34'><span class='white' id='text1'>AWS CardDemo</span>  </div>
  <div class='lgr_08 col_71'><dynamic-field [id]='"date1"' [size]=8 [line]=1 [column]=71 [(ngModel)]='date1'></dynamic-field></div>
</div>
<div class='lgr_col'>
  <div class='lgr_10 col_01'><dynamic-field [id]='"labelUser"' [size]=10 [line]=2 [column]=1 [(ngModel)]='labelUser'></dynamic-field></div>
  <div class='lgr_21 col_30'><dynamic-field [id]='"labelCardActivityHistory"' [size]=21 [line]=2 [column]=30 [(ngModel)]='labelCardActivityHistory'></dynamic-field></div>
  <div class='lgr_08 col_71'><dynamic-field [id]='"time1"' [size]=8 [line]=2 [column]=71 [edtwrd]='"0  :  :  "' [(ngModel)]='time1'></dynamic-field></div>
</div>
<div class='lgr_col empty'>
</div>
<div class='lgr_col'>
  <div class='lgr_12 col_01'><span class='default' id='text2'>Card Number:</span>  </div>
  <div class='lgr_19 col_14'><dynamic-field [id]='"cardnum"' [size]=19 [line]=4 [column]=14 [digitNb]='16' [decSize]='0' [edtwrd]='"    -    -    -    "' [(ngModel)]='cardnum'></dynamic-field></div>
</div>
<div class='lgr_col empty'>
</div>
<div class='lgr_col'>
  <div class='lgr_08 col_01'><dynamic-field [id]='"labelActivity"' [size]=8 [line]=6 [column]=1 [(ngModel)]='labelActivity'></dynamic-field></div>
  <div class='lgr_11 col_11'><dynamic-field [id]='"labelDescription"' [size]=11 [line]=6 [column]=11 [(ngModel)]='labelDescription'></dynamic-field></div>
  <div class='lgr_04 col_38'><dynamic-field [id]='"labelUser1"' [size]=4 [line]=6 [column]=38 [(ngModel)]='labelUser1'></dynamic-field></div>
  <div class='lgr_09 col_50'><dynamic-field [id]='"labelTimestamp"' [size]=9 [line]=6 [column]=50 [(ngModel)]='labelTimestamp'></dynamic-field></div>
</div>
</div>
